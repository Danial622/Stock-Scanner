name: Run Stock Scoring

on:
  schedule:
    # Runs daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the updated scores.json back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scoring script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json
          # Only commit if scores.json actually changed
          git diff --staged --quiet || git commit -m "Update scores.json"
          git push
